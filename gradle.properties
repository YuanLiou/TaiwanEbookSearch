# Run JVM on background daemon
org.gradle.daemon = true
org.gradle.parallel = true
org.gradle.caching= true

# Setting JVM memory
org.gradle.jvmargs= -Xmx3072m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Host Server
HOST = "ebook.yuer.tw"

# AndroidX
android.useAndroidX=true
android.enableJetifier=true

# Experimental features
android.debug.obsoleteApi=true

# Enable R8
android.enableR8.fullMode=false
# AGP 9 預設開啟 optimized resource shrinking，需 non-final resource IDs；
# 本專案維持 nonFinalResIds=false，故先 opt-out 以保留既有 release minify 行為。
android.r8.optimizedResourceShrinking=false

# Kotlin
kapt.use.worker.api=true
android.nonTransitiveRClass=false
android.nonFinalResIds=false
